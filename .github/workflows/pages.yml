name: Pages

# Website and APT repository on GitHub Pages:
#   https://sparkdrago05.github.io/odoo-dev-panel/      website (website/, docs rendered from Markdown)
#   https://sparkdrago05.github.io/odoo-dev-panel/apt/  signed APT repository with the newest releases
# Runs when a release is published, when the site or docs change on main, and by hand.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "packaging/apt/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEEP_RELEASES: 5

jobs:
  build:
    name: Build site and APT repository
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.debs.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils python3-markdown
      - name: Download the .deb of the newest releases
        id: debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs/all
          latest=""
          count=0
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                         --limit 100 --json tagName -q '.[].tagName'); do
            dir="debs/$tag"
            mkdir -p "$dir"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
                   --pattern 'odoo-dev-panel_*_amd64.deb' --pattern SHA256SUMS 2>/dev/null; then
              echo "skip $tag: no odoo-dev-panel_*_amd64.deb"
              continue
            fi
            if [ -f "$dir/SHA256SUMS" ]; then (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS); fi
            mv "$dir"/odoo-dev-panel_*_amd64.deb debs/all/
            [ -n "$latest" ] || latest=${tag#v}
            count=$((count + 1))
            [ "$count" -lt "$KEEP_RELEASES" ] || break
          done
          [ "$count" -gt 0 ] || { echo "no release with a .deb" >&2; exit 1; }
          ls -l debs/all
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Website
        run: python3 website/build.py site --version "${{ steps.debs.outputs.version }}"
      - name: APT repository
        run: packaging/apt/build-repo.sh debs/all site/apt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: apt install on Ubuntu ${{ matrix.release }}
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.release }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Add the repository as the install docs say
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq wget ca-certificates
          install -d -m 0755 /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/odoo-dev-panel.asc https://sparkdrago05.github.io/odoo-dev-panel/apt/odoo-dev-panel.asc
          tee /etc/apt/sources.list.d/odoo-dev-panel.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://sparkdrago05.github.io/odoo-dev-panel/apt
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/odoo-dev-panel.asc
          EOF
      - name: Wait for the new version (Pages caches for up to 10 minutes)
        run: |
          set -eu
          for i in $(seq 1 15); do
            apt-get update -qq -o Acquire::https::No-Cache=true
            candidate=$(apt-cache policy odoo-dev-panel | awk '/Candidate:/{print $2}')
            echo "try $i: candidate $candidate, want $VERSION"
            [ "$candidate" = "$VERSION" ] && exit 0
            sleep 60
          done
          exit 1
      - name: Install and run
        run: |
          set -eux
          apt-get install -y -qq odoo-dev-panel
          test "$(dpkg-query -W -f '${Version}' odoo-dev-panel)" = "$VERSION"
          odp --help >/dev/null
